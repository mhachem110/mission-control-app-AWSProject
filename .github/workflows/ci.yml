
name: Mission Control CI

on:
  push:
    branches: [main]
    
jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Download source code
        uses: actions/checkout@v4


      - name: Test Mission Control
        run: grep -n "MISSION CONTROL" index.html

        
      - name: Prepare build artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html

        #This will store the artifact in the GitHub Actions Artifact Storage, 
        #where we can downlaod the code artifact after on our computer
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-build
          path: dist/